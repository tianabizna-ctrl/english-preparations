<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="letters" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#1e1b4b" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- rounded app tile with margin -->
  <rect x="56" y="56" width="912" height="912" rx="205" fill="url(#bg)"/>
  <rect x="56" y="56" width="912" height="912" rx="205" fill="url(#glow)"/>

  <!-- open book tucked at the bottom -->
  <g transform="translate(512 826)">
    <path d="M0 0 C-68 -30 -168 -30 -244 6 L-244 90 C-168 54 -68 54 0 84 Z" fill="url(#pageL)"/>
    <path d="M0 0 C68 -30 168 -30 244 6 L244 90 C168 54 68 54 0 84 Z" fill="url(#pageR)"/>
    <path d="M0 0 L0 84" stroke="#a5b4fc" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- speech bubble -->
  <g filter="url(#soft)">
    <path d="M300 258 h424 a86 86 0 0 1 86 86 v250 a86 86 0 0 1 -86 86 H486 L352 792 L368 680 H300 a86 86 0 0 1 -86 -86 V344 a86 86 0 0 1 86 -86 Z"
          fill="#ffffff"/>
  </g>

  <!-- letters EN -->
  <text x="512" y="546" text-anchor="middle" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"
        font-size="292" font-weight="700" fill="url(#letters)" letter-spacing="2">EN</text>

  <!-- sparkles -->
  <path d="M840 300 l18 48 48 18 -48 18 -18 48 -18 -48 -48 -18 48 -18 z" fill="#ffffff" opacity="0.95"/>
  <path d="M232 748 l11 30 30 11 -30 11 -11 30 -11 -30 -30 -11 30 -11 z" fill="#ffffff" opacity="0.7"/>
</svg>
