name: Release

# Builds Easy English for macOS, Windows and Android and attaches the
# installers to a GitHub Release.
#
#   • Push a tag like v1.1.0  ->  builds + publishes a release for that tag.
#   • Or run it manually from the Actions tab, giving the tag to release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag / version to build & release (e.g. v1.1.0)"
        required: true
        type: string

# Needed so the release job can create the Release and upload assets.
permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------- macOS
  macos:
    name: macOS (dmg + zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: desktop
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # Builds x64 + arm64 dmg & zip (see desktop/package.json "build.mac").
      - name: Build macOS installers
        working-directory: desktop
        run: npm run dist:mac -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip

  # -------------------------------------------------------------- Windows
  windows:
    name: Windows (setup + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: desktop
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build Windows installers
        working-directory: desktop
        run: npm run dist:win -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: desktop/dist/*.exe

  # -------------------------------------------------------------- Android
  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      # syncWeb copies ../app into assets/www before preBuild.
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/*.apk

  # -------------------------------------------------------------- Release
  release:
    name: Publish GitHub Release
    needs: [macos, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List collected artifacts
        run: find artifacts -type f -exec ls -lh {} \;

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Easy English ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          body: |
            Easy English — Mianatra Anglisy.

            **Downloads**
            - macOS (Intel): `Easy English <version> x64.dmg`
            - macOS (Apple Silicon): `Easy English <version> arm64.dmg`
            - Windows: `Easy English Setup <version>.exe` or `Easy English Portable <version>.exe`
            - Android: `Easy English <version>.apk`

            These builds are unsigned — macOS Gatekeeper and Windows SmartScreen
            may warn on first launch (right-click → Open on macOS). Android needs
            "install from unknown sources" enabled.
          files: artifacts/**/*
